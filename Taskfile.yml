version: '3'

vars:
  APP_NAME: MyGit
  BIN_DIR: bin
  PACKAGE_MANAGER: npm
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  GOOS: '{{.GOOS | default OS}}'
  # Product version, read from build/config.yml, used to version artifact filenames.
  VERSION:
    sh: go run ./build/version

env:
  GOWORK: 'off'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Build the application for the host platform
    cmds:
      - task: '{{.GOOS}}:build'
  package:
    summary: Package the application for the host platform
    cmds:
      - task: '{{.GOOS}}:package'
  version:
    summary: Print the product version from build/config.yml
    cmds:
      - echo {{.VERSION}}
  run:
    summary: Run the built application
    cmds:
      - task: '{{.GOOS}}:run'
  dev:
    summary: Start Wails and Vite with automatic rebuilds
    cmds:
      - go tool wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
  bindings:
    summary: Generate TypeScript interfaces and named service calls
    cmds:
      - go tool wails3 generate bindings -ts -i -names
  check:
    summary: Run frontend checks and Go analysis
    cmds:
      - go vet ./...
      - task: check:frontend
  check:frontend:
    dir: frontend
    cmds:
      - npm run check
      - npm test
