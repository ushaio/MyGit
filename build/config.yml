version: '3'

info:
  companyName: MyGit
  productName: MyGit
  productIdentifier: app.mygit.desktop
  description: MyGit
  copyright: Copyright 2026 MyGit contributors
  version: 0.4.0

dev_mode:
  root_path: .
  log_level: warn
  debounce: 500
  ignore:
    dir: [.git, node_modules, frontend, bin, build]
    file: [.DS_Store, .gitignore, .gitkeep, '*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: go tool wails3 build DEV=true
      type: blocking
    - cmd: go tool wails3 task common:dev:frontend
      type: background
      readiness:
        tcp: localhost:9245
        timeout: 60s
        interval: 200ms
    - cmd: go tool wails3 task run
      type: primary
      exit_policy: shutdown
