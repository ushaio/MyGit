name: Package

on:
  # 手动触发（Actions 页面 -> Run workflow）
  # 可选模式：
  #   verify  —— 只构建打包用于验证，不发版（产物在本次运行的 Artifacts 中）
  #   release —— 构建后发布 GitHub Release（需填写版本号，如 0.3.2）
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式：verify=只验证打包不发版；release=构建并发布 Release"
        type: choice
        options:
          - verify
          - release
        default: verify
      version:
        description: "发版版本号（仅 mode=release 时使用，不含前导 v），须与 CHANGELOG 中的 [版本] 一致"
        type: string
        required: false
  # 推送形如 v0.1.0 的 tag 时构建并发布 Release
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            task: windows:package
            artifact: mygit-windows
          - os: macos
            runner: macos-latest
            task: darwin:package:dmg
            artifact: mygit-macos
          - os: linux
            runner: ubuntu-24.04
            task: linux:package
            artifact: mygit-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Linux（GTK4 + WebKitGTK 6.0 栈，以及 AppImage 打包所需的工具链）
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            pkg-config pkgconf dpkg-dev \
            libglib2.0-bin libgdk-pixbuf2.0-bin libgtk-3-bin \
            xz-utils file binutils

      # Windows（NSIS 打包安装器）
      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build & package
        run: go tool wails3 task ${{ matrix.task }}
        env:
          # AppImage 打包时避免依赖 FUSE
          APPIMAGE_EXTRACT_AND_RUN: "1"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            bin/*.exe
            bin/*.dmg
            bin/*.AppImage
            bin/*.deb
            bin/*.rpm
            bin/*.pkg.tar.zst

  release:
    name: Publish release
    needs: build
    # 发版条件：
    #   - 推送 v* tag；或
    #   - 手动触发且 mode=release
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: meta
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${INPUT_VERSION#v}"
            if [ -z "$version" ]; then
              echo "::error::手动发版需要在 version 输入框填写版本号（不含前导 v）"
              exit 1
            fi
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Extract changelog for ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG entry found for ${version} in CHANGELOG.md"
            exit 1
          fi
          # 手动发版时本地可能还没有该 tag，用已有 tag 生成对比链接（可能为空）。
          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$previous" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...v%s\n' \
              "$GITHUB_REPOSITORY" "$previous" "$version" >> release-notes.md
          fi
          cat release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 手动发版时 tag 可能尚不存在，由 action 自动创建。
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/**
          body_path: release-notes.md
